schema = 1

# know-thy-build-demo harness — M1 (DB가 등장해 compose + integration 스모크가 있다, §5.2.1).
# Sections marked (protected) can only change through a human-merged PR (integrity blocks agents).

[project]
name           = "know-thy-build-demo"
spec_dir       = "docs/features"
runs_dir       = "docs/factory/runs"
default_branch = "main"

[runtime]
setup = "npm ci"
node  = "22"

[commands]                       # all judged by exit code
# 이 데모에는 린터가 없다(eslint 미설치). 게이트 자리를 비워 두면 `gates.required`가
# MISCONFIGURED가 되므로, "항상 통과하는 명령"을 명시적으로 둔다 — 린터를 도입하면 이 두 줄만 바뀐다.
lint       = "node -e 0"
unit       = "npx vitest run --reporter=json --outputFile=.factory/out/unit.json"
# e2e(M2, #15): 앱을 띄우고 HTTP 표면을 본다. 판정 근거는 **종료 코드 하나**다 — `[test].e2e_report`를
# 두지 않는 이유는 playwright JSON을 vitest 파서에 먹이면 `total:0, failed:0`이 오류 없이 나와
# "읽지 못했는데 읽었다"가 되기 때문이다. 브라우저 다운로드는 여기 넣지 않는다(docs/QA.md: 테스트
# 프로세스는 외부 네트워크 금지) — 크로미움이 없는 머신에서는 `playwright.config.js`가 `page` 픽스처
# 케이스만 레인에서 빼고 나머지를 돈다(신호: `E2E_BROWSER_AVAILABLE`, docs/QA.md). 테스트를 고르는
# 인자(`--grep`/`--project` 등)는 여기 붙이지 않는다 — 붙이면 `package.json`의 `npm run e2e`(보호 경로라
# 고칠 수 없다)와 게이트가 서로 다른 집합을 돌게 된다. 이 명령은 `factory doctor`도 매번 실행한다(`--no-run`으로 건너뛴다).
e2e        = "npx playwright test"
test_files = "npx vitest run {files}"            # prove-test / new-test-repeat
test_one   = "npx vitest run {file} -t {name}"   # classify-failure. Scripts quote {file}/{name} — do not add quotes here
lint_file  = "node -e 0 {file}"                  # lint-touched.sh (logging only). {file}은 doctor가 요구하는 자리표시자 — 여기서는 무시되는 argv다

[harness]
maturity = "M2"                  # M0 | M1 | M2 — promotion is a factory:harness issue + human merge
                                 # M2(#15): HTTP 표면(`GET /healthz`)이 e2e 게이트로 지켜진다.
                                 # 문자열만 올리는 것은 승격이 아니다 — 아래 [gates]의 세 목록이 함께 움직인다.

[factory]
orchestration   = "workflow"     # workflow | agent
required_checks = ["factory/gates", "factory/review", "factory/integrity"]

[commands.proof]                 # fill when the proof gates are actually listed in [gates]
# coverage        = "npx vitest run --coverage --coverage.reporter=json"
# coverage_report = ".factory/out/coverage/coverage-final.json"
# mutation        = "npx stryker run --incremental"
# mutation_report = "reports/mutation/mutation.json"

[gates]
# e2e는 세 자리에 **함께** 들어가야 한다(#15): `required`에 없으면 `commands.e2e`가 사라져도
# gates.js의 required 교집합 필터가 그것을 MISCONFIGURED가 아니라 GREEN으로 읽는다 — 꺼진 게이트가
# 초록으로 보이는 상태다. `fast`에는 넣지 않는다: docs tier PR(CHARTER Tiers)까지 앱 기동을 기다리게 된다.
required = ["lint", "unit", "e2e"]
fast     = ["lint", "unit"]
full     = ["lint", "unit", "e2e"]
deep     = ["lint", "unit", "e2e"]

[gates.thresholds]               # (protected)
diff_coverage_pct       = 90
mutation_score_pct      = 70
new_test_repeats        = 3
flaky_isolation_runs    = 3
flaky_base_runs         = 5
quarantine_max          = 5
quarantine_ttl_days     = 28
quarantine_return_after = 30

[test]
guide       = "docs/QA.md"
naming      = "test_{issue}_{slug}"
smoke       = { unit = "test/smoke.test.js", integration = "test/integration/db.test.js" }
runtime_budget_min = 12
test_glob   = ["test/**/*.test.js"]
source_glob = ["src/**/*.js"]
unit_report = ".factory/out/unit.json"

[test.env]
compose   = "docker-compose.test.yml"
# env_file  = ".env.test"
# seed      = ""
# app_start = ""
# app_ready = ""     # M2에서도 켜지 않는다(#15). 앱을 띄우는 주인은 `playwright.config.js`의
#                    # `webServer` 하나다 — 여기서도 띄우면 둘이 같은 포트를 다툰다. 그리고
#                    # `.factory/lib/test-env.js`의 app_ready 폴링은 `if (env.app_start)` 안에 있어
#                    # app_ready만 켜면 읽히지도 않는 죽은 설정이다.
ready_timeout_sec = 90

[test.fakes]

[protected]                      # (protected)
# 빌드 설정 파일도 보호한다 — [commands]의 게이트 명령(lint/unit/test_files/…)이 전부 이 파일들을
# 거쳐 해석되므로, 에이전트가 여기를 고치면 "게이트를 통과시키는" 가장 쉬운 길이 코드를 고치는 게
# 아니라 판정 기준을 고치는 것이 된다(테스트 제외, 린트 규칙 해제, 의존성 교체).
# 바꿔야 한다면 경로는 하나다: `factory:harness` 이슈 → 사람이 diff를 보고 머지(§5.1).
factory       = [".factory/**", ".claude/**", ".github/workflows/factory-*.yml", "docs/factory/CHARTER.md",
                 "package.json", "package-lock.json", "vitest.config.*", "playwright.config.*",
                 "tsconfig*.json", ".eslintrc*", "eslint.config.*", "docker-compose.test.yml"]
                 # `.factory/out/qa/**`는 qa 리뷰어의 증거물 저장소다 — 판정의 근거가 되는 스크린샷·로그를
                 # 남길 수 없으면 §5.2.3의 "증거 없는 재현은 일어나지 않은 재현"이 성립하지 않는다.
except        = [".factory/lessons/**", "docs/factory/runs/**", ".factory/out/qa/**"]
additive_only = { ".claude/agents/*.md" = ["## Examples", "## Perspectives"] }
tests_are_load_bearing = true

[load_bearing]
paths = []

[evidence]
qa_artifacts = ".factory/out/qa/**"
